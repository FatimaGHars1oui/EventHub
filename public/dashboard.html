<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestivEvents | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --dark: #0f172a; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; width: 260px; position: fixed; background: var(--dark); color: white; padding-top: 20px; }
        .nav-link { color: #94a3b8; padding: 12px 20px; cursor: pointer; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; border-radius: 8px; margin: 0 10px; }
        .main-content { margin-left: 260px; padding: 30px; }
        .dashboard-section { display: none; }
        .dashboard-section.active { display: block; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="text-center fw-bold mb-4">FestivEvents</h4>
        <a class="nav-link active" onclick="showSection('overview', event)"><i class="fas fa-home me-2"></i> Vue d'ensemble</a>
        <a class="nav-link" onclick="showSection('bookings', event)"><i class="fas fa-ticket-alt me-2"></i> Mes Réservations</a>
        
        <div id="organizer-menu" style="display:none">
            <hr>
            <a class="nav-link" onclick="showSection('my-events', event)"><i class="fas fa-calendar me-2"></i> Mes Événements</a>
            <a class="nav-link" onclick="showSection('add-event', event)"><i class="fas fa-plus me-2"></i> Ajouter Event</a>
        </div>

        <a class="nav-link text-danger mt-5" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Déconnexion</a>
    </div>

    <!-- Main -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="welcome-msg">Bonjour!</h2>
            <div class="text-end">
                <span class="badge bg-primary" id="user-role">Role</span>
                <p class="small text-muted mb-0" id="user-email"></p>
            </div>
        </div>

        <!-- Section 1: Overview -->
        <div id="overview" class="dashboard-section active">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card p-4 bg-white">
                        <h6>Total Réservations</h6>
                        <h2 id="total-bookings" class="fw-bold">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-4 bg-white">
                        <h6>Événements Actifs</h6>
                        <h2 id="total-events" class="fw-bold">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2: Bookings -->
        <div id="bookings" class="dashboard-section">
            <div class="card p-4">
                <h4 class="mb-4">Mes Réservations</h4>
                <table class="table">
                    <thead><tr><th>ID</th><th>Événement</th><th>Date</th><th>Statut</th></tr></thead>
                    <tbody id="bookings-table"></tbody>
                </table>
            </div>
        </div>

        <!-- Section 3: My Events -->
        <div id="my-events" class="dashboard-section">
            <div class="card p-4">
                <h4>Mes Événements</h4>
                <table class="table">
                    <thead><tr><th>Titre</th><th>Date</th><th>Ventes</th></tr></thead>
                    <tbody id="events-table"></tbody>
                </table>
            </div>
        </div>

        <!-- Section 4: Add Event -->
        <div id="add-event" class="dashboard-section">
            <div class="card p-4">
                <h4>Ajouter un événement</h4>
                <form id="add-event-form">
                    <div class="mb-3"><label>Titre</label><input type="text" name="title" class="form-control" required></div>
                    <div class="mb-3"><label>Capacité</label><input type="number" name="available_seats" class="form-control" required></div>
                    <div class="mb-3"><label>Prix (DH)</label><input type="number" name="price" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
    // استخدام var لتجنب أخطاء إعادة التعريف
    var API_URL = "http://127.0.0.1:8000/api";

    window.onload = function() {
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        
        // إذا لم تكن هناك بيانات، ارجع لصفحة الدخول
        if (!token || !userStr || userStr === "undefined") {
            window.location.href = 'index.html';
            return;
        }

        try {
            const user = JSON.parse(userStr);
            console.log("Utilisateur connecté:", user); // للتأكد من البيانات في Console

            // تحديث بيانات الملف الشخصي مع حماية ضد القيم الفارغة
            const name = user.name || 'Utilisateur';
            const role = (user.role || 'user').toUpperCase(); // إصلاح مشكلة toUpperCase

            document.getElementById('welcome-msg').innerText = `Bonjour, ${name} 👋`;
            document.getElementById('user-email').innerText = user.email || '';
            document.getElementById('user-role').innerText = role;

            // إظهار قائمة المنظم بناءً على الرتبة
            const lowerRole = (user.role || 'user').toLowerCase();
            if (lowerRole === 'organizer' || lowerRole === 'admin') {
                document.getElementById('organizer-menu').style.display = 'block';
            }

            // تحميل أول قسم
            loadOverview();

        } catch (e) {
            console.error("Erreur parsing user:", e);
            logout();
        }
    };

    // دالة التنقل بين الأقسام
    function showSection(sectionId, event) {
        if(event) {
            event.preventDefault();
            event.stopPropagation();
        }

        console.log("Changement de section vers:", sectionId);

        // تغيير حالة الروابط
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        // نحدد الزر الذي تم ضغطه
        if(event && event.currentTarget) event.currentTarget.classList.add('active');

        // إخفاء وإظهار الأقسام
        document.querySelectorAll('.dashboard-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(sectionId);
        if(target) target.classList.add('active');

        // جلب بيانات القسم المختار
        if (sectionId === 'bookings') loadBookings();
        if (sectionId === 'my-events') loadMyEvents();
        if (sectionId === 'overview') loadOverview();
    }

    // دالة جلب البيانات (المحسنة)
    async function fetchAPI(endpoint, method = 'GET', body = null) {
        const token = localStorage.getItem('token');
        
        // تأكد من أن التوكن ليس نصاً فارغاً أو كلمة "null"
        if (!token || token === "null") {
            console.error("Token manquant!");
            return null;
        }

        const headers = {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/json'
        };

        let options = { method, headers };
        
        // إذا كان الجسم FormData (مثل رفع الصور)، لا نضع Content-Type يدوياً
        if (body) {
            options.body = body;
        }

        try {
            const response = await fetch(`${API_URL}${endpoint}`, options);
            
            if (response.status === 401) {
                console.error("401: Non autorisé. Vérifiez le Token.");
                Swal.fire('Session expirée', 'Veuillez vous reconnecter', 'warning').then(() => {
                    logout();
                });
                return null;
            }
            
            return await response.json();
        } catch (error) {
            console.error("Erreur réseau:", error);
            return null;
        }
    }

    async function loadOverview() {
        const result = await fetchAPI('/stats/overview');
        if (result && result.data) {
            document.getElementById('total-bookings').innerText = result.data.total_bookings || 0;
            document.getElementById('total-events').innerText = result.data.total_events || 0;
        }
    }

    async function loadBookings() {
        const tbody = document.getElementById('bookings-table');
        if(!tbody) return;
        
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">Chargement...</td></tr>';
        
        const result = await fetchAPI('/my-bookings');
        if (result && result.data) {
            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">Aucune réservation.</td></tr>';
                return;
            }
            tbody.innerHTML = result.data.map(b => `
                <tr>
                    <td>#${b.id}</td>
                    <td>${b.event ? b.event.title : 'Event'}</td>
                    <td>${new Date(b.created_at).toLocaleDateString()}</td>
                    <td><span class="badge bg-success">${b.status}</span></td>
                </tr>
            `).join('');
        }
    }

    async function loadMyEvents() {
        const tbody = document.getElementById('events-table');
        const result = await fetchAPI('/organizer/events');
        if (result && result.data) {
            tbody.innerHTML = result.data.map(e => `
                <tr>
                    <td>${e.title}</td>
                    <td>${e.start_date}</td>
                    <td>${e.bookings_count || 0}</td>
                </tr>
            `).join('');
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
