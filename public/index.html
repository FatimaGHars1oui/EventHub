<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub Fès</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #0d6efd; }
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1549913772-820279f902b4?q=80&w=2070'); background-size: cover; background-position: center; height: 40vh; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .category-pill { cursor: pointer; padding: 8px 20px; border-radius: 30px; background: white; border: 1px solid #ddd; transition: 0.3s; white-space: nowrap; margin-right: 10px; display: inline-block; font-size: 14px; }
        .category-pill.active, .category-pill:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-add-event { position: fixed; bottom: 30px; right: 30px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #ticket-to-print { background: white !important; padding: 0; border-radius: 15px; border: 2px dashed #ddd; max-width: 450px; margin: auto; color: black !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Event<span class="text-primary">Hub</span></a>
            <!-- هذا هو المكان الذي تظهر فيه الأزرار - تأكد من وجود الـ ID -->
            <div id="auth-section" class="ms-auto d-flex align-items-center"></div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1 class="display-4 fw-bold">Événements à Fès</h1>
            <form id="search-form" class="mt-4 mx-auto" style="max-width: 600px;">
                <div class="input-group">
                    <input type="text" id="search-input" class="form-control rounded-pill-start" placeholder="Rechercher...">
                    <button class="btn btn-primary rounded-pill-end px-4" type="submit">OK</button>
                </div>
            </form>
        </div>
    </header>

    <main class="container my-5">
        <div id="categories-nav" class="d-flex overflow-x-auto pb-3 mb-4"></div>
        <!-- هذا هو المكان الذي تظهر فيه الفعاليات - تأكد من وجود الـ ID -->
        <div id="events-container" class="row g-4">
            <div class="text-center py-5 w-100">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">Exploration des événements à Fès...</p>
            </div>
        </div>
    </main>

    <!-- MODALS (Login, Register, Payment, Ticket, AddEvent) -->
    <!-- (نفس المودالات السابقة التي قدمتها لك، تأكد فقط من وجودها جميعاً) -->
    
    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"><form id="login-form">
                <div class="modal-header bg-primary text-white"><h5>Connexion</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body p-4">
                    <div class="mb-3"><label>Email</label><input type="email" id="login-email" class="form-control" required></div>
                    <div class="mb-3"><label>Mot de passe</label><input type="password" id="login-password" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Se connecter</button>
                </div>
            </form></div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"><form id="register-form">
                <div class="modal-header bg-success text-white"><h5>Inscription</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body p-4">
                    <div class="mb-3"><label>Nom complet</label><input type="text" id="register-name" class="form-control" required></div>
                    <div class="mb-3"><label>Email</label><input type="email" id="register-email" class="form-control" required></div>
                    <div class="mb-3"><label>Mot de passe</label><input type="password" id="register-password" class="form-control" required minlength="8"></div>
                    <div class="mb-4"><label>Confirmer</label><input type="password" id="register-password-confirm" class="form-control" required></div>
                    <button type="submit" class="btn btn-success w-100 rounded-pill text-white">Créer mon compte</button>
                </div>
            </form></div>
        </div>
    </div>

    <!-- Ticket Modal -->
    <div class="modal fade" id="ticketModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 bg-transparent">
                <div class="modal-body p-0">
                    <div id="ticket-to-print" class="shadow-lg bg-white text-center">
                        <div class="bg-primary text-white p-3"><h4>VOTRE TICKET</h4><p id="ticket-event-title" class="m-0"></p></div>
                        <div class="p-4">
                            <div id="ticket-qrcode" class="mb-3"></div>
                            <h5 id="ticket-number" class="fw-bold text-primary"></h5>
                            <p class="m-0 small">Participant: <span id="ticket-user" class="fw-bold"></span></p>
                            <p class="small">Date: <span id="ticket-date" class="fw-bold"></span></p>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button onclick="bookingFlow.downloadPDF()" class="btn btn-warning rounded-pill px-4 me-2">PDF</button>
                        <button class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Fermer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="paymentModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="payment-form"><div class="modal-header"><h5>Paiement</h5></div><div class="modal-body"><div id="payment-event-info" class="alert alert-info"></div><input type="text" class="form-control mb-3" placeholder="Carte Bancaire" required><button type="submit" id="pay-btn" class="btn btn-success w-100">Payer</button></div></form></div></div></div>

    <button id="add-event-fab" class="btn btn-primary btn-add-event d-none" onclick="ui.showEventModal()"><i class="fas fa-plus fs-4"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
    <script src="js/app.js"></script>
</body>
</html>
