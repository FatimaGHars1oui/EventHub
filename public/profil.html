<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #6366f1;
            --dark: #0f172a;
            --gold: #f59e0b;
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
        }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--light-bg); 
            color: #1e293b; 
            overflow-x: hidden; 
            min-height: 100vh;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Playfair Display', serif; }

        /* Navigation */
        .navbar {
            background: linear-gradient(135deg, var(--dark) 0%, #1a2332 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 1rem 0; 
            border-bottom: 2px solid var(--primary);
        }
        .navbar-brand { font-size: 1.8rem; font-weight: 900; color: white !important; }
        .navbar-brand span { color: var(--gold); }
        .nav-link { color: #e2e8f0 !important; font-weight: 500; margin: 0 10px; transition: 0.3s; }
        .nav-link:hover { color: var(--gold) !important; }

        /* Profile Header */
        .profile-header {
            background: linear-gradient(135deg, var(--dark) 0%, #1e293b 50%, var(--primary) 100%);
            padding: 60px 0 80px;
            position: relative;
            overflow: hidden;
        }
        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 50%;
        }
        .profile-header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 50%;
        }

        /* Profile Avatar */
        .profile-avatar-wrapper {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 5px solid white;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            background: white;
            margin-top: -70px;
            position: relative;
            z-index: 2;
        }
        .profile-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Stats Cards */
        .stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }
        .stat-card .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .stat-card h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 2rem; }

        /* Booking Card */
        .booking-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: 0.3s;
        }
        .booking-card:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }
        .booking-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        /* Section Title */
        .section-title {
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Info Card */
        .info-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
        }
        .info-card .info-header {
            background: linear-gradient(135deg, var(--primary), #4338ca);
            padding: 20px 25px;
            color: white;
        }

        /* Edit Modal Enhancement */
        .edit-field {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            transition: 0.3s;
        }
        .edit-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* Favorite Card */
        .fav-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
            cursor: pointer;
        }
        .fav-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(99,102,241,0.1);
        }
        .fav-card img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
        }

        /* Tabs */
        .profile-tabs .nav-link {
            color: #64748b !important;
            font-weight: 600;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            transition: 0.3s;
        }
        .profile-tabs .nav-link.active {
            background: var(--primary) !important;
            color: white !important;
        }
        .profile-tabs .nav-link:hover:not(.active) {
            background: #f1f5f9;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .btn-premium {
            background: var(--primary);
            color: white;
            border-radius: 50px;
            padding: 12px 30px;
            border: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-premium:hover { background: #4f46e5; transform: scale(1.05); color: white; }

        /* Loading */
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Dark Mode */
        [data-bs-theme="dark"] body { background: #0f172a; color: #e2e8f0; }
        [data-bs-theme="dark"] .stat-card, [data-bs-theme="dark"] .booking-card, [data-bs-theme="dark"] .info-card, [data-bs-theme="dark"] .fav-card { background: #1e293b; border-color: #334155; }
        [data-bs-theme="dark"] .profile-tabs .nav-link { color: #94a3b8 !important; }
        [data-bs-theme="dark"] .profile-tabs .nav-link:hover:not(.active) { background: #334155; }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // التحقق من تسجيل الدخول
            if (!isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }
            
            loadProfileData();
            loadMyBookings();
            loadMyFavorites();
        });

        function loadProfileData() {
            const user = getCurrentUser();
            if (!user) return;

            const name = user.name || 'Utilisateur';
            const email = user.email || '';
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);

            // Avatar
            document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff&size=200`;
            
            // Noms
            document.getElementById('header-name').innerText = name;
            document.getElementById('profile-display-name').innerText = name;
            document.getElementById('profile-display-email').innerText = email;
            
            // Infos
            document.getElementById('info-name').innerText = name;
            document.getElementById('info-email').innerText = email;
            document.getElementById('info-since').innerText = user.created_at ? formatDate(user.created_at) : 'Récemment';
            document.getElementById('info-role').innerText = (user.role === 'admin' || user.is_admin) ? 'Administrateur' : 'Utilisateur';
            if (user.role === 'admin' || user.is_admin) {
                document.getElementById('info-role').classList.remove('bg-primary');
                document.getElementById('info-role').classList.add('bg-danger');
            }

            // Favoris locaux
            const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
            document.getElementById('stat-favorites').innerText = favs.length;
        }

        async function loadMyBookings() {
            const token = getToken();
            const container = document.getElementById('my-bookings-list');
            if (!token || !container) return;

            try {
                const res = await fetch('http://127.0.0.1:8000/api/my-bookings', {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });

                if (res.ok) {
                    const data = await res.json();
                    const bookings = data.data || data;
                    
                    // تحديث الإحصائيات
                    document.getElementById('stat-reservations').innerText = bookings.length;
                    const total = bookings.reduce((sum, b) => sum + (b.total_price || b.price * (b.quantity || 1) || 0), 0);
                    document.getElementById('stat-total-spent').innerText = total + ' DH';

                    if (bookings.length === 0) {
                        container.innerHTML = `
                            <div class="col-12">
                                <div class="empty-state">
                                    <i class="fas fa-ticket-alt d-block"></i>
                                    <h5 class="fw-bold text-muted">Aucune réservation</h5>
                                    <p class="small">Vous n'avez pas encore réservé d'événement.</p>
                                    <a href="index.html" class="btn btn-premium btn-sm mt-3 px-4">Explorer les événements</a>
                                </div>
                            </div>`;
                        return;
                    }

                    container.innerHTML = bookings.map(b => {
                        const event = b.event || {};
                        let img = event.image || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=500';
                        if (img && !img.startsWith('http')) img = `http://127.0.0.1:8000/storage/${img}`;
                        
                        const price = b.total_price || (event.price || 0) * (b.quantity || 1);
                        const statusClass = b.status === 'confirmed' || b.status === 'confirmé' ? 'bg-success' : b.status === 'cancelled' ? 'bg-danger' : 'bg-warning';
                        const statusText = b.status === 'confirmed' || b.status === 'confirmé' ? 'Confirmé' : b.status === 'cancelled' ? 'Annulé' : 'En attente';
                        const eventDate = event.start_date || event.event_date || event.date || b.created_at;

                        return `
                        <div class="col-md-6 col-lg-4">
                            <div class="booking-card">
                                <div class="position-relative">
                                    <img src="${img}" alt="${escapeHtml(event.title || 'Événement')}" onerror="this.src='https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=500'">
                                    <span class="badge ${statusClass} position-absolute m-2 top-0 end-0">${statusText}</span>
                                </div>
                                <div class="p-4">
                                    <h6 class="fw-bold mb-2">${escapeHtml(event.title || 'Événement')}</h6>
                                    <div class="d-flex align-items-center gap-2 text-muted small mb-2">
                                        <i class="fas fa-calendar-alt"></i>
                                        <span>${formatDate(eventDate)}</span>
                                    </div>
                                    <div class="d-flex align-items-center gap-2 text-muted small mb-3">
                                        <i class="fas fa-users"></i>
                                        <span>${b.quantity || 1} place(s)</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                        <span class="fw-bold text-primary">${price === 0 ? 'Gratuit' : price + ' DH'}</span>
                                        <span class="text-muted" style="font-size: 0.7rem;">#${b.id || '---'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    // إذا فشل API، نعرض الحجوزات المحلية
                    loadLocalBookings();
                }
            } catch(e) {
                console.error('Erreur bookings:', e);
                loadLocalBookings();
            }
        }

        function loadLocalBookings() {
            const container = document.getElementById('my-bookings-list');
            const localBookings = JSON.parse(localStorage.getItem('my_bookings') || '[]');
            
            document.getElementById('stat-reservations').innerText = localBookings.length;

            if (localBookings.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <i class="fas fa-ticket-alt d-block"></i>
                            <h5 class="fw-bold text-muted">Aucune réservation</h5>
                            <p class="small">Vous n'avez pas encore réservé d'événement.</p>
                            <a href="index.html" class="btn btn-premium btn-sm mt-3 px-4">Explorer les événements</a>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = localBookings.map(b => {
                const event = EVENTS.find(e => e.id == b.event_id) || {};
                return `
                <div class="col-md-6 col-lg-4">
                    <div class="booking-card">
                        <img src="${event.image || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=500'}" alt="${escapeHtml(event.title || 'Événement')}">
                        <div class="p-4">
                            <h6 class="fw-bold mb-2">${escapeHtml(event.title || 'Événement inconnu')}</h6>
                            <div class="d-flex align-items-center gap-2 text-muted small mb-2">
                                <i class="fas fa-calendar-alt"></i>
                                <span>${formatDate(event.date)}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2 text-muted small mb-3">
                                <i class="fas fa-users"></i>
                                <span>${b.quantity || 1} place(s)</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <span class="fw-bold text-primary">${event.price === 0 ? 'Gratuit' : (event.price * (b.quantity || 1)) + ' DH'}</span>
                                <span class="badge bg-success">Confirmé</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadMyFavorites() {
            const container = document.getElementById('my-favorites-list');
            const favIds = JSON.parse(localStorage.getItem('favorites') || '[]');
            
            if (favIds.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <i class="fas fa-heart d-block"></i>
                            <h5 class="fw-bold text-muted">Aucun favori</h5>
                            <p class="small">Cliquez sur le cœur d'un événement pour l'ajouter ici.</p>
                            <a href="index.html" class="btn btn-premium btn-sm mt-3 px-4">Explorer les événements</a>
                        </div>
                    </div>`;
                return;
            }

            // إذا EVENTS ما تزالش محملة، ننتظر شوية
            if (EVENTS.length === 0) {
                setTimeout(loadMyFavorites, 1500);
                return;
            }

            const favEvents = EVENTS.filter(e => favIds.includes(e.id));

            if (favEvents.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <i class="fas fa-heart-broken d-block"></i>
                            <h5 class="fw-bold text-muted">Favoris introuvables</h5>
                            <p class="small">Ces événements ne sont plus disponibles.</p>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = favEvents.map(e => `
                <div class="col-md-6">
                    <div class="fav-card" onclick="window.location.href='index.html'">
                        <img src="${e.image}" alt="${escapeHtml(e.title)}" onerror="this.src='https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=200'">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold mb-1">${escapeHtml(e.title)}</h6>
                            <p class="text-muted small mb-1"><i class="fas fa-calendar-alt me-1"></i>${formatDate(e.date)}</p>
                            <p class="text-primary fw-bold small mb-0">${e.price === 0 ? 'Gratuit' : e.price + ' DH'}</p>
                        </div>
                        <button class="btn btn-sm btn-outline-danger rounded-circle p-2 flex-shrink-0" onclick="event.stopPropagation(); removeFavorite(${e.id})" title="Retirer">
                            <i class="fas fa-trash small"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function removeFavorite(id) {
            let favs = JSON.parse(localStorage.getItem('favorites') || '[]');
            favs = favs.filter(f => f !== id);
            localStorage.setItem('favorites', JSON.stringify(favs));
            document.getElementById('stat-favorites').innerText = favs.length;
            loadMyFavorites();
            showToast('Retiré des favoris', 'error');
        }

        function openEditModal() {
            const user = getCurrentUser();
            if (!user) return;
            document.getElementById('edit-name').value = user.name || '';
            document.getElementById('edit-email').value = user.email || '';
            document.getElementById('edit-password').value = '';
            new bootstrap.Modal(document.getElementById('editProfileModal')).show();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const editForm = document.getElementById('edit-profile-form');
            if (editForm) {
                editForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('edit-name').value.trim();
                    const email = document.getElementById('edit-email').value.trim();
                    const password = document.getElementById('edit-password').value;

                    if (!name || !email) {
                        Swal.fire('Erreur', 'Nom et email sont requis.', 'error');
                        return;
                    }

                    try {
                        const body = { name, email };
                        if (password) body.password = password;

                        const res = await fetch('http://127.0.0.1:8000/api/user/update', {
                            method: 'PUT',
                            headers: { 
                                'Authorization': `Bearer ${getToken()}`, 
                                'Content-Type': 'application/json', 
                                'Accept': 'application/json' 
                            },
                            body: JSON.stringify(body)
                        });

                        const data = await res.json();

                        if (res.ok) {
                            // تحديث البيانات محلياً
                            const user = getCurrentUser();
                            user.name = name;
                            user.email = email;
                            localStorage.setItem('user', JSON.stringify(user));
                            
                            bootstrap.Modal.getInstance(document.getElementById('editProfileModal')).hide();
                            loadProfileData();
                            Swal.fire({ icon: 'success', title: 'Mis à jour !', text: 'Votre profil a été modifié.', timer: 2000, showConfirmButton: false });
                        } else {
                            let msg = 'Erreur lors de la modification.';
                            if (data.message) msg = data.message;
                            else if (data.errors) msg = Object.values(data.errors).flat().join('\n');
                            Swal.fire('Erreur', msg, 'error');
                        }
                    } catch(err) {
                        // Fallback: تحديث محلي فقط
                        const user = getCurrentUser();
                        user.name = name;
                        user.email = email;
                        localStorage.setItem('user', JSON.stringify(user));
                        bootstrap.Modal.getInstance(document.getElementById('editProfileModal')).hide();
                        loadProfileData();
                        showToast('Profil mis à jour localement', 'success');
                    }
                });
            }
        });

        async function confirmDeleteAccount() {
            const result = await Swal.fire({
                title: 'Supprimer le compte ?',
                html: '<p class="text-danger">Cette action est <strong>irréversible</strong>. Toutes vos données et réservations seront perdues.</p>',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonText: 'Annuler',
                confirmButtonText: 'Oui, supprimer définitivement',
                reverseButtons: true
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch('http://127.0.0.1:8000/api/user/delete', {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${getToken()}` }
                    });
                    
                    if (res.ok) {
                        setCurrentUser(null);
                        Swal.fire({ icon: 'success', title: 'Compte supprimé', text: 'Vos données ont été effacées.' }).then(() => {
                            window.location.href = 'index.html';
                        });
                    } else {
                        Swal.fire('Erreur', 'Impossible de supprimer le compte.', 'error');
                    }
                } catch(e) {
                    Swal.fire('Erreur', 'Serveur indisponible.', 'error');
                }
            }
        }
    </script>

</body>
